<!DOCTYPE html>
<html lang="id">
<head>




  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ular Tangga Bercanda</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #ffd9ec 0%, #ffc1de 45%, #ffb0d3 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
      color: #6d174a;
    }

    .app {
      width: min(100%, 430px);
      position: relative;
    }

    .topbar {
      position: relative;
      padding-top: 8px;
      margin-bottom: 10px;
    }

    .title {
      text-align: center;
      font-size: 26px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.8px;
      margin: 8px 54px 8px;
      text-transform: uppercase;
      color: #8a1355;
      text-shadow: 0 2px 0 rgba(255,255,255,0.45);
    }

    .settings-btn {
      position: absolute;
      right: 0;
      top: 0;
      width: 48px;
      height: 48px;
      border: 2px solid #b42873;
      background: linear-gradient(180deg, #ffe1ef 0%, #ffbfdc 100%);
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 14px rgba(180,40,115,0.18);
    }

    .board-frame {
      border: 4px solid #b42873;
      background: #ffcae2;
      padding: 6px;
      aspect-ratio: 1 / 1;
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      box-shadow: 0 14px 34px rgba(180,40,115,0.22);
    }

    .board {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);

      background-color: #fff7fb;
      background-image: url("backgrond-papan.png");
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;

      border-radius: 22px;
      overflow: hidden;
    }

    /* Kotak dibuat sebagai area klik/posisi saja, tidak menutupi gambar */
    .cell {
      position: relative;
      border: 0.6px solid rgba(138, 19, 85, 0.20);
      background: transparent;
      padding: 0;
      font-size: 0;
      color: transparent;
    }

    /* Semua marker bawaan aplikasi disembunyikan karena sudah ada di gambar background */
    .cell-mark,
    .cell-mark-top,
    .lines {
      display: none !important;
    }

    .tokens {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .token {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      color: white;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
      border: 3px solid white;
      box-shadow: 0 3px 9px rgba(0,0,0,0.45);
      transform: translate(-50%, -50%);
      transition: left 0.34s ease, top 0.34s ease, transform 0.18s ease;
      z-index: 10;
    }

    .token.step-pop {
      transform: translate(-50%, -50%) scale(1.2);
    }

    .bottom-row {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: stretch;
    }

    .info-box,
    .dice-box {
      border: 2px solid #c42f7d;
      background: linear-gradient(180deg, #fff0f7 0%, #ffd8e9 100%);
      min-height: 104px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      box-shadow: 0 10px 22px rgba(196,47,125,0.16);
    }

    .turn-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .turn-icon {
      font-size: 40px;
      line-height: 1;
    }

    .turn-label {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 6px;
      color: #8a1355;
    }

    .turn-player {
      font-size: 14px;
      font-weight: 800;
      color: #6d174a;
    }

    .dice-area {
      width: 100%;
      display: grid;
      justify-items: center;
      gap: 8px;
    }

    .dice {
      width: 68px;
      height: 68px;
      border: 2px solid #b42873;
      border-radius: 18px;
      background: linear-gradient(180deg, #fff8fc 0%, #ffd9eb 100%);
      display: grid;
      place-items: center;
      font-size: 38px;
      font-weight: 900;
      box-shadow: inset 0 -5px 0 rgba(180,40,115,0.12), 0 8px 16px rgba(180,40,115,0.12);
      color: #8a1355;
    }

    .dice.rolling { animation: rollDice 0.12s linear infinite; }

    @keyframes rollDice {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(15deg) scale(1.08); }
      100% { transform: rotate(-15deg) scale(1); }
    }

    .roll-btn {
      width: 100%;
      border: 2px solid #b42873;
      background: linear-gradient(180deg, #ff4fa0 0%, #e83e8c 100%);
      color: #fff;
      font-weight: 900;
      padding: 10px 8px;
      cursor: pointer;
      border-radius: 14px;
      text-transform: uppercase;
      font-size: 13px;
      box-shadow: 0 8px 18px rgba(232,62,140,0.28);
    }

    .roll-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .status-box {
      display: none;
    }

    .players-mini {
      margin-top: 12px;
      display: grid;
      gap: 8px;
    }

    .player-mini {
      border: 1.8px solid #d94c95;
      background: linear-gradient(180deg, #fff2f8 0%, #ffe0ee 100%);
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      border-radius: 14px;
      color: #6d174a;
    }

    .player-mini.active {
      background: linear-gradient(180deg, #ffcee5 0%, #ffb5d6 100%);
      border-color: #b42873;
      box-shadow: 0 6px 14px rgba(180,40,115,0.18);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal-overlay.show { display: flex; }

    .modal-box {
      width: min(92vw, 360px);
      background: linear-gradient(180deg, #fff2f8 0%, #ffd8ea 100%);
      border: 2px solid #b42873;
      padding: 18px;
      box-shadow: 0 18px 40px rgba(180,40,115,0.28);
      animation: modalPop 0.25s ease;
      border-radius: 22px;
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.9) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-title {
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 14px;
      text-align: center;
      color: #8a1355;
    }

    .modal-label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #6d174a;
    }

    .modal-input {
      width: 100%;
      border: 2px solid #d94c95;
      background: #fff9fc;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 14px;
      outline: none;
      border-radius: 12px;
      color: #6d174a;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-btn {
      border: 2px solid #b42873;
      background: #fff8fc;
      padding: 12px;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
      color: #8a1355;
      border-radius: 12px;
    }

    .modal-btn.primary {
      background: linear-gradient(180deg, #ff4fa0 0%, #e83e8c 100%);
      color: white;
      border-color: #b42873;
    }

    .punishment-box { text-align: center; }
    .punishment-icon { font-size: 42px; margin-bottom: 10px; }

    .punishment-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 8px;
      text-transform: uppercase;
      color: #8a1355;
    }

    .punishment-text {
      font-size: 17px;
      line-height: 1.45;
      margin-bottom: 14px;
      color: #6d174a;
    }


    .punishment-image {
      width: min(100%, 260px);
      aspect-ratio: 1 / 1;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
      border-radius: 18px;
      border: 2px solid #b42873;
      background: #fff8fc;
      box-shadow: 0 10px 24px rgba(180,40,115,0.18);
    }

    .punishment-timer {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.65);
      border: 2px dashed #d94c95;
      color: #8a1355;
      font-size: 18px;
      font-weight: 900;
    }

    .punishment-timer.show {
      display: block;
    }

    .modal-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }


    /* Mode khusus setelah tombol Start diklik:
       popup hanya menampilkan timer besar agar fokus */
    .modal-overlay.timer-focus {
      background: rgba(138, 19, 85, 0.72);
      backdrop-filter: blur(4px);
    }

    .modal-overlay.timer-focus .modal-box {
      width: min(86vw, 390px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      padding: 18px;
      background: radial-gradient(circle at top, #fff4fb 0%, #ffd1e6 55%, #ff9cca 100%);
      border: 6px solid #b42873;
      border-radius: 34px;
      box-shadow: 0 28px 80px rgba(80, 0, 45, 0.45);
    }

    .modal-overlay.timer-focus .punishment-image,
    .modal-overlay.timer-focus .punishment-title,
    .modal-overlay.timer-focus #startPunishmentBtn {
      display: none !important;
    }

    .modal-overlay.timer-focus .punishment-timer {
      display: grid !important;
      place-items: center;
      width: 230px;
      height: 230px;
      margin: 0;
      padding: 0;
      border-radius: 50%;
      border: 8px solid #b42873;
      background: #fff8fc;
      color: #8a1355;
      font-size: 112px;
      font-weight: 900;
      line-height: 1;
      box-shadow:
        inset 0 -10px 0 rgba(180, 40, 115, 0.12),
        0 18px 45px rgba(180, 40, 115, 0.35);
      animation: timerPulse 1s ease-in-out infinite;
    }

    @keyframes timerPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    @media (max-width: 420px) {
      body { padding: 8px; }
      .title { font-size: 21px; }
      .bottom-row { gap: 10px; }
      .info-box, .dice-box { min-height: 98px; }
      .turn-label { font-size: 16px; }
      .turn-player { font-size: 13px; }
      .dice { width: 62px; height: 62px; font-size: 34px; }
      .token { width: 21px; height: 21px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">ULAR TANGGA<br>BERCANDA</div>
      <button class="settings-btn" id="openSettingsBtn" title="Setting">⚙️</button>
    </div>

    <div class="board-frame">
      <div id="board" class="board">
        <svg id="lines" class="lines"></svg>
        <div id="tokens" class="tokens"></div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="info-box">
        <div class="turn-wrap">
          <div class="turn-icon">♟️</div>
          <div>
            <div class="turn-label">Giliran :</div>
            <div id="turnPlayer" class="turn-player">Belum diatur</div>
          </div>
        </div>
      </div>

      <div class="dice-box">
        <div class="dice-area">
          <div id="dice" class="dice">🎲</div>
          <button id="rollBtn" class="roll-btn">Putar Dadu</button>
        </div>
      </div>
    </div>

    <div id="statusBox" class="status-box"></div>
    <div id="playersMini" class="players-mini"></div>
  </div>

  <div id="settingsModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">Setting Pemain</div>
      <label for="playerCount" class="modal-label">Jumlah Pemain (2 - 6)</label>
      <input type="number" id="playerCount" class="modal-input" min="2" max="6" value="2" />
      <div class="modal-actions">
        <button class="modal-btn" id="closeSettingsBtn">Tutup</button>
        <button class="modal-btn primary" id="saveSettingsBtn">Simpan</button>
      </div>
    </div>
  </div>

  <div id="punishmentModal" class="modal-overlay">
    <div class="modal-box punishment-box">
      <img id="punishmentImage" class="punishment-image" src="hukuman.png" alt="Hukuman">
      <div id="punishmentTitle" class="punishment-title">TANTANGAN HUKUMAN</div>
      <button class="modal-btn primary" id="startPunishmentBtn">Start</button>
      <div id="punishmentTimer" class="punishment-timer">15</div>
    </div>
  </div>

  <script>
    const board = document.getElementById("board");
    const tokensLayer = document.getElementById("tokens");
    const diceBox = document.getElementById("dice");
    const rollBtn = document.getElementById("rollBtn");
    const statusBox = document.getElementById("statusBox");
    const playersMini = document.getElementById("playersMini");
    const turnPlayer = document.getElementById("turnPlayer");

    const settingsModal = document.getElementById("settingsModal");
    const punishmentModal = document.getElementById("punishmentModal");
    const punishmentImage = document.getElementById("punishmentImage");
    const punishmentTitle = document.getElementById("punishmentTitle");
    const startPunishmentBtn = document.getElementById("startPunishmentBtn");
    const punishmentTimer = document.getElementById("punishmentTimer");
    const playerCountInput = document.getElementById("playerCount");

    const openSettingsBtn = document.getElementById("openSettingsBtn");
    const closeSettingsBtn = document.getElementById("closeSettingsBtn");
    const saveSettingsBtn = document.getElementById("saveSettingsBtn");
    let punishmentCountdownInterval = null;

    const snakes = {
      15: 7,
      44: 22,
      68: 34,
      92: 87,
      98: 77
    };

    const ladders = {
      3: 24,
      27: 35,
      42: 78,
      49: 71,
      67: 95
    };

    const punishmentCells = [4, 8, 12, 16, 24, 28, 36, 39, 46, 50, 54, 60, 63, 73, 76, 82, 86, 91, 97];
    const punishmentData = {
      4: { title: "Hukuman Kotak 4", image: "hukuman-4.png" },
      8: { title: "Hukuman Kotak 8", image: "hukuman-8.png" },
      12: { title: "Hukuman Kotak 12", image: "hukuman-12.png" },
      16: { title: "Hukuman Kotak 16", image: "hukuman-16.png" },
      24: { title: "Hukuman Kotak 24", image: "hukuman-24.png" },
      28: { title: "Hukuman Kotak 28", image: "hukuman-28.png" },
      36: { title: "Hukuman Kotak 36", image: "hukuman-36.png" },
      39: { title: "Hukuman Kotak 39", image: "hukuman-39.png" },
      46: { title: "Hukuman Kotak 46", image: "hukuman-46.png" },
      50: { title: "Hukuman Kotak 50", image: "hukuman-50.png" },
      54: { title: "Hukuman Kotak 54", image: "hukuman-54.png" },
      60: { title: "Hukuman Kotak 60", image: "hukuman-60.png" },
      63: { title: "Hukuman Kotak 63", image: "hukuman-63.png" },
      73: { title: "Hukuman Kotak 73", image: "hukuman-73.png" },
      76: { title: "Hukuman Kotak 76", image: "hukuman-76.png" },
      82: { title: "Hukuman Kotak 82", image: "hukuman-82.png" },
      86: { title: "Hukuman Kotak 86", image: "hukuman-86.png" },
      91: { title: "Hukuman Kotak 91", image: "hukuman-91.png" },
      97: { title: "Hukuman Kotak 97", image: "hukuman-97.png" }
    };
    const playerColors = ["#e53935", "#1e88e5", "#43a047", "#8e24aa", "#fb8c00", "#00897b"];

    let players = [];
    let currentPlayer = 0;
    let gameStarted = false;
    let gameOver = false;
    let popupCloseCallback = null;

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function createBoard() {
      board.querySelectorAll(".cell").forEach(cell => cell.remove());

      const displayNumbers = [];
      for (let row = 9; row >= 0; row--) {
        const start = row * 10 + 1;
        const nums = Array.from({ length: 10 }, (_, i) => start + i);

        if ((9 - row) % 2 === 0) nums.reverse();
        displayNumbers.push(...nums);
      }

      displayNumbers.forEach(num => {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.num = num;
        board.appendChild(cell);
      });
    }

    function getCellCenter(num) {
      const cell = board.querySelector(`.cell[data-num="${num}"]`);
      const boardRect = board.getBoundingClientRect();
      const cellRect = cell.getBoundingClientRect();

      return {
        x: cellRect.left - boardRect.left + cellRect.width / 2,
        y: cellRect.top - boardRect.top + cellRect.height / 2
      };
    }

    function openSettings() {
      settingsModal.classList.add("show");
    }

    function closeSettings() {
      settingsModal.classList.remove("show");
    }

    function saveSettings() {
      const count = Number(playerCountInput.value);

      if (count < 2 || count > 6) {
        return;
      }

      players = Array.from({ length: count }, (_, i) => ({
        name: `Pemain ${i + 1}`,
        position: 1,
        color: playerColors[i]
      }));

      currentPlayer = 0;
      gameStarted = true;
      gameOver = false;
      rollBtn.disabled = false;
      diceBox.textContent = "🎲";

      renderTokens();
      renderPlayersMini();
      updateTurnDisplay();
      closeSettings();
    }

    function renderTokens() {
      tokensLayer.innerHTML = "";

      players.forEach((player, index) => {
        const token = document.createElement("div");
        token.className = "token";
        token.id = `token-${index}`;
        token.textContent = index + 1;
        token.style.background = player.color;
        tokensLayer.appendChild(token);
        moveToken(index, player.position, true);
      });
    }

    function moveToken(playerIndex, position, instant = false) {
      const token = document.getElementById(`token-${playerIndex}`);
      if (!token) return;

      const center = getCellCenter(position);
      const boardRect = board.getBoundingClientRect();

      const offsetPattern = [
        [-7, -7], [7, -7], [-7, 7],
        [7, 7], [0, -10], [0, 10]
      ];
      const offset = offsetPattern[playerIndex] || [0, 0];

      if (instant) {
        token.style.transition = "none";
        setTimeout(() => token.style.transition = "", 40);
      }

      token.style.left = `${(center.x / boardRect.width) * 100}%`;
      token.style.top = `${(center.y / boardRect.height) * 100}%`;
      token.style.marginLeft = `${offset[0]}px`;
      token.style.marginTop = `${offset[1]}px`;

      token.classList.add("step-pop");
      setTimeout(() => token.classList.remove("step-pop"), 150);
    }

    async function walkStepByStep(playerIndex, from, to) {
      const direction = to > from ? 1 : -1;
      let position = from;

      while (position !== to) {
        position += direction;
        players[playerIndex].position = position;
        moveToken(playerIndex, position);
        renderPlayersMini();
        updateTurnDisplay();
        await sleep(360);
      }
    }

    function renderPlayersMini() {
      playersMini.innerHTML = "";

      players.forEach((player, index) => {
        const item = document.createElement("div");
        item.className = "player-mini" + (index === currentPlayer && !gameOver ? " active" : "");
        item.innerHTML = `
          <span style="color:${player.color}">${player.name}</span>
          <span>Posisi: ${player.position}</span>
        `;
        playersMini.appendChild(item);
      });
    }

    function updateTurnDisplay() {
      turnPlayer.textContent = players.length ? players[currentPlayer].name : "Belum diatur";
    }

    function showPunishmentPopup(position) {
      return new Promise(resolve => {
        const data = punishmentData[position] || { title: `Hukuman Kotak ${position}`, image: "hukuman.png" };
        punishmentImage.src = data.image;
        punishmentTitle.innerHTML = `${data.title}<br><small>Kotak ${position}</small>`;
        punishmentModal.classList.remove("timer-focus");
        punishmentTimer.textContent = "15";
        punishmentTimer.classList.remove("show");
        startPunishmentBtn.disabled = false;
        startPunishmentBtn.textContent = "Start";
        popupCloseCallback = resolve;
        punishmentModal.classList.add("show");
      });
    }

    function startPunishmentTimer() {
      if (!popupCloseCallback) return;

      let seconds = 35;
      punishmentModal.classList.add("timer-focus");
      startPunishmentBtn.disabled = true;
      startPunishmentBtn.textContent = "Berjalan...";
      punishmentTimer.textContent = seconds;
      punishmentTimer.classList.add("show");

      if (punishmentCountdownInterval) {
        clearInterval(punishmentCountdownInterval);
      }

      punishmentCountdownInterval = setInterval(() => {
        seconds--;
        punishmentTimer.textContent = seconds;

        if (seconds <= 0) {
          clearInterval(punishmentCountdownInterval);
          punishmentCountdownInterval = null;
          closePunishmentPopup();
        }
      }, 1000);
    }

    function closePunishmentPopup() {
      punishmentModal.classList.remove("show");
      punishmentModal.classList.remove("timer-focus");

      if (punishmentCountdownInterval) {
        clearInterval(punishmentCountdownInterval);
        punishmentCountdownInterval = null;
      }

      if (popupCloseCallback) {
        popupCloseCallback();
        popupCloseCallback = null;
      }
    }

    function rollDice() {
      if (!gameStarted || gameOver) return;

      rollBtn.disabled = true;
      diceBox.classList.add("rolling");

      const diceInterval = setInterval(() => {
        diceBox.textContent = Math.floor(Math.random() * 6) + 1;
      }, 90);

      setTimeout(() => {
        clearInterval(diceInterval);
        diceBox.classList.remove("rolling");
        const diceValue = Math.floor(Math.random() * 6) + 1;
        diceBox.textContent = diceValue;
        playTurn(diceValue);
      }, 900);
    }

    async function playTurn(diceValue) {
      const player = players[currentPlayer];
      const playerIndex = currentPlayer;
      const oldPosition = player.position;
      const targetPosition = oldPosition + diceValue;

      if (targetPosition > 100) {
        nextPlayer();
        return;
      }

      await walkStepByStep(playerIndex, oldPosition, targetPosition);

      if (snakes[player.position]) {
        const from = player.position;
        const to = snakes[player.position];
        await sleep(450);
        await walkStepByStep(playerIndex, from, to);
      } else if (ladders[player.position]) {
        const from = player.position;
        const to = ladders[player.position];
        await sleep(450);
        await walkStepByStep(playerIndex, from, to);
      }

      if (punishmentCells.includes(player.position)) {
        await sleep(300);
        await showPunishmentPopup(player.position);
      }

      if (player.position === 100) {
        gameOver = true;
        rollBtn.disabled = true;
        renderPlayersMini();
        updateTurnDisplay();
        setTimeout(() => alert(`${player.name} menang!`), 200);
        return;
      }

      nextPlayer();
    }

    function nextPlayer() {
      setTimeout(() => {
        if (gameOver) return;
        currentPlayer = (currentPlayer + 1) % players.length;
        renderPlayersMini();
        updateTurnDisplay();
        rollBtn.disabled = false;
      }, 500);
    }

    openSettingsBtn.addEventListener("click", openSettings);
    closeSettingsBtn.addEventListener("click", closeSettings);
    saveSettingsBtn.addEventListener("click", saveSettings);
    startPunishmentBtn.addEventListener("click", startPunishmentTimer);
    rollBtn.addEventListener("click", rollDice);

    settingsModal.addEventListener("click", (e) => {
      if (e.target === settingsModal) closeSettings();
    });

    punishmentModal.addEventListener("click", (e) => {
      // Modal hukuman tidak ditutup dengan klik luar.
      // Pemain harus klik Start dan menunggu timer selesai.
    });

    window.addEventListener("resize", () => {
      players.forEach((player, index) => moveToken(index, player.position, true));
    });

    createBoard();
    updateTurnDisplay();
    rollBtn.disabled = true;

  

</body>
