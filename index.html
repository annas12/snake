<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Game Pasutri</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      background: #000000;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      border-radius: 22px;
      background: #0b0b0b;
      border: 1px solid #ff2f68;
      text-align: center;
    }

    .login-title {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1;
      font-weight: 950;
      color: #ff2f68;
      text-transform: uppercase;
    }

    .login-subtitle {
      margin: 0 0 24px;
      font-size: 15px;
      line-height: 1.6;
      color: #ffffff;
    }

    .login-label {
      display: block;
      margin-bottom: 8px;
      text-align: left;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
    }

    .login-input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border-radius: 14px;
      border: 1px solid #ff2f68;
      background: #000000;
      color: #ffffff;
      font-size: 16px;
      outline: none;
    }

    .login-input::placeholder {
      color: #999999;
    }

    .login-button {
      width: 100%;
      height: 54px;
      margin-top: 16px;
      border: none;
      border-radius: 14px;
      background: #ff004c;
      color: #ffffff;
      font-size: 16px;
      font-weight: 950;
      text-transform: uppercase;
      cursor: pointer;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-message {
      min-height: 22px;
      margin-top: 16px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
    }

    .login-message.error {
      color: #ff8aa8;
    }

    .login-message.success {
      color: #ffffff;
    }

    .register-box {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 47, 104, 0.35);
    }

    .register-text {
      margin: 0 0 10px;
      font-size: 14px;
      line-height: 1.5;
      color: #ffffff;
      font-weight: 700;
    }

    .register-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      border-radius: 14px;
      background: transparent;
      border: 1px solid #ff2f68;
      color: #ff8aa8;
      font-size: 15px;
      font-weight: 900;
      text-decoration: none;
      text-transform: uppercase;
    }

    .register-link:hover {
      background: #ff004c;
      color: #ffffff;
    }

    .login-note {
      margin: 18px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: #bbbbbb;
    }
  
    .choice-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(8, 0, 20, .72);
      backdrop-filter: blur(8px);
    }
    .choice-overlay.show { display: grid; }
    .choice-box {
      width: min(390px, 100%);
      padding: 28px 22px;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(0,0,0,.3);
      text-align: center;
    }
    .choice-box h2 { margin: 0 0 8px; color: #35113d; }
    .choice-box p { margin: 0 0 20px; color: #6e5b72; line-height: 1.5; }
    .choice-actions { display: grid; gap: 10px; }
    .choice-btn {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: #812b78;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }
    .choice-btn.secondary { color: #812b78; background: #f3e8f2; }
</style>
</head>

<body>
  <div class="login-box">
    <h1 class="login-title">Login Game</h1>

    <p class="login-subtitle">
      Masukkan email yang sudah terdaftar untuk membuka akses game.
    </p>

    <form id="loginForm">
      <label class="login-label" for="emailInput">Email</label>

      <input
        class="login-input"
        type="email"
        id="emailInput"
        placeholder="contoh@email.com"
        required
      >

      <button class="login-button" type="submit" id="loginButton">
        Masuk ke Game
      </button>

      <div class="login-message" id="loginMessage"></div>
    </form>

    <div class="register-box">
      <p class="register-text">
        Belum punya akun?
      </p>

      <a
        class="register-link"
        href="https://storejualan.myscalev.com/game-pasutri"
      >
        Daftar Sekarang
      </a>
    </div>

    <p class="login-note">
      Akses hanya untuk email yang ada di daftar pembeli.
    </p>
  </div>

  <div id="gameChoiceOverlay" class="choice-overlay" role="dialog" aria-modal="true" aria-labelledby="gameChoiceTitle">
    <div class="choice-box">
      <h2 id="gameChoiceTitle">Login berhasil</h2>
      <p>Pilih permainan yang ingin kamu buka.</p>
      <div class="choice-actions">
        <button id="goSnakeBtn" class="choice-btn">🐍 Ular Tangga</button>
        <a class="choice-btn" href="https://games.drama.my.id/">🎮 Game Lainnya</a>
        <button id="closeChoiceBtn" class="choice-btn secondary">Tutup</button>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw_u3ks0WEAs3h0CYymTF5K5wjWuVLQqWWvHJsTVg4IIxKYP1DhL68fm0wLBIMF0igp/exec";
    const GAME_URL = "./game.html";
    const gameChoiceOverlay = document.getElementById("gameChoiceOverlay");
    const goSnakeBtn = document.getElementById("goSnakeBtn");
    const closeChoiceBtn = document.getElementById("closeChoiceBtn");

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("loginMessage");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "login-message " + type;
    }

    function jsonpRequest(params, callback) {
      const callbackName = "callback_" + Date.now() + "_" + Math.floor(Math.random() * 99999);

      window[callbackName] = function(data) {
        callback(data);
        delete window[callbackName];
        script.remove();
      };

      const query = new URLSearchParams({
        ...params,
        callback: callbackName,
        t: Date.now()
      });

      const script = document.createElement("script");
      script.src = WEB_APP_URL + "?" + query.toString();

      script.onerror = function() {
        callback({
          ok: false,
          message: "Gagal terhubung ke server login."
        });

        delete window[callbackName];
        script.remove();
      };

      document.body.appendChild(script);
    }

    goSnakeBtn.addEventListener("click", function() {
      window.location.replace(GAME_URL);
    });
    closeChoiceBtn.addEventListener("click", function() {
      gameChoiceOverlay.classList.remove("show");
    });

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const email = emailInput.value.trim().toLowerCase();

      if (!email || !email.includes("@")) {
        showMessage("Masukkan email yang benar.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Mengecek...";
      showMessage("Sebentar, email sedang dicek...", "success");

      jsonpRequest({
        action: "login",
        email: email
      }, function(result) {
        if (result.ok) {
          localStorage.setItem("game_pasutri_email", result.email);
          localStorage.setItem("game_pasutri_session_id", result.session_id);
          localStorage.setItem("game_pasutri_login_at", Date.now());

          showMessage("Login berhasil. Pilih permainan.", "success");
          gameChoiceOverlay.classList.add("show");
        } else {
          showMessage(result.message || "Email belum terdaftar.", "error");
          button.disabled = false;
          button.textContent = "Masuk ke Game";
        }
      });
    });
  </script>
</body>
</html>
